name: Maven Build and Test

on:
  push:
    branches:
      - master
      - develop
      - '**'
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    name: Build on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8, 11]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Display Maven and Java version
        run: |
          mvn --version
          java -version
      
      - name: Build with Maven
        run: mvn clean install -DskipTests -Dcheckstyle.skip=true -B -V
      
      - name: Run tests
        run: mvn test -B
        continue-on-error: true
      
      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-java${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/hs_err_pid*.log
            **/target/*.log
          retention-days: 7
  
  build-with-docker:
    name: Build with Docker (Maven 3.9 + Java 8)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-docker-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-docker-
      
      - name: Build with Maven Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$HOME/.m2":/root/.m2 \
            -w /workspace \
            maven:3.9-eclipse-temurin-8 \
            mvn clean install -DskipTests -Dcheckstyle.skip=true -B -V
      
      - name: Run tests with Maven Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$HOME/.m2":/root/.m2 \
            -w /workspace \
            maven:3.9-eclipse-temurin-8 \
            mvn test -B
        continue-on-error: true
      
      - name: Upload Docker build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-docker
          path: |
            **/target/surefire-reports/
            **/hs_err_pid*.log
            **/target/*.log
          retention-days: 7
